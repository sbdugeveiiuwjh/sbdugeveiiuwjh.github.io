<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AYDIX</title>
<meta name="theme-color" content="#050816">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">

<style>
:root{--bg:#fff;--fg:#14141a;--mut:#767680;--line:#e8e8ee;--acc:#e8384f;--card:#f3f3f7}
@media(prefers-color-scheme:dark){:root{--bg:#0f0f13;--fg:#f2f2f6;--mut:#8e8e99;--line:#26262e;--card:#1b1b22}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}body{background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;position:relative;border-inline:1px solid var(--line)}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
header h1{font:italic 700 26px Georgia,serif;letter-spacing:-.5px}
main{flex:1;overflow-y:auto;scrollbar-width:none}main::-webkit-scrollbar{display:none}
nav{display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:8px 0;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
nav button{font-size:24px;opacity:.45;padding:2px 14px}nav button.on{opacity:1}
.stories{display:flex;gap:12px;padding:12px 14px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.st{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;min-width:64px}
.ring{padding:3px;border-radius:50%;background:conic-gradient(var(--acc),#f5a623,#7a4cff,var(--acc))}.ring.seen{background:var(--line)}
.av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;border:3px solid var(--bg)}
.av.s{width:34px;height:34px;font-size:13px;border:0}.av.l{width:84px;height:84px;font-size:30px;border:0}
.post{border-bottom:1px solid var(--line);padding-bottom:10px}
.ph{display:flex;align-items:center;gap:10px;padding:10px 14px;font-weight:600}
.img{width:100%;aspect-ratio:1;display:block;background:var(--card);position:relative;object-fit:cover}
.pop{position:absolute;inset:0;display:grid;place-items:center;font-size:90px;pointer-events:none;animation:pop .7s forwards}
@keyframes pop{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:0}}
.bar{display:flex;gap:14px;padding:10px 14px 4px;font-size:24px}.bar .r{margin-left:auto}
.liked{color:var(--acc)}.pt{padding:0 14px}.mut{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.grid img{width:100%;aspect-ratio:1;object-fit:cover;display:block;cursor:pointer}
.search{margin:10px 14px;padding:10px 14px;border-radius:12px;border:0;background:var(--card);color:var(--fg);width:calc(100% - 28px);font:inherit}
.reels{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
.reel{height:100%;scroll-snap-align:start;position:relative;color:#fff;overflow:hidden}
.reel img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.reel .shade{position:absolute;inset:0;background:linear-gradient(transparent 50%,rgba(0,0,0,.65))}
.reel .cap{position:absolute;left:14px;bottom:18px;right:80px}
.reel .side{position:absolute;right:12px;bottom:24px;display:flex;flex-direction:column;gap:18px;align-items:center;font-size:28px}
.reel .side small{display:block;font-size:12px;text-align:center}
.sheet,.ov{position:absolute;inset:0;z-index:5}
.ov{background:#000;color:#fff;display:flex;flex-direction:column}
.ov .prog{display:flex;gap:4px;padding:12px 10px 6px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.ov .prog i{flex:1;height:3px;background:#fff4;border-radius:2px;overflow:hidden}.ov .prog b{display:block;height:100%;background:#fff;width:0}
.ov .prog i.d b{width:100%}.ov .prog i.a b{animation:fill 4s linear forwards}@keyframes fill{to{width:100%}}
.sheet{background:#0007;display:flex;align-items:flex-end}
.box{background:var(--bg);width:100%;max-height:75%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding:14px}
.list{overflow-y:auto;flex:1;margin:10px 0}.cm{padding:6px 0}
.row{display:flex;gap:8px}.row input,.row textarea{flex:1;padding:10px 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit}
.pri{background:var(--acc);color:#fff;border-radius:20px;padding:8px 18px;font-weight:600}
.ghost{border:1px solid var(--line);border-radius:10px;padding:7px 14px;font-weight:600}
.pad{padding:14px}.stats{display:flex;gap:22px;text-align:center;margin-left:auto}.stats b{display:block;font-size:18px}
.drop{display:grid;place-items:center;aspect-ratio:1;border:2px dashed var(--line);border-radius:16px;color:var(--mut);cursor:pointer;overflow:hidden}.drop img{width:100%;height:100%;object-fit:cover}
.toast{position:absolute;left:50%;bottom:80px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:20px;z-index:9;font-size:13px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const K='frame_v1';
const NAMES=['maya','rohan','zoya','kabir','anaya','dev','isha','neel'];
const CAPS=['Golden hour never misses','Weekend reset','New colours, new mood','Slow mornings','Found this corner of the city','Coffee first, plans later','Rain on the window','Made this today'];
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const rnd=(s,n)=>{const x=Math.sin(s*97+n*13)*1e4;return x-Math.floor(x)};
function art(s){const r=n=>rnd(s,n),h=n=>Math.floor(r(n)*360);
return 'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${h(1)} 70% 62%)"/><stop offset="1" stop-color="hsl(${h(2)} 65% 38%)"/></linearGradient></defs><rect width="400" height="400" fill="url(#g)"/><circle cx="${r(3)*400}" cy="${r(4)*400}" r="${60+r(5)*90}" fill="hsl(${h(6)} 80% 72%)" opacity=".7"/><circle cx="${r(7)*400}" cy="${r(8)*400}" r="${40+r(9)*80}" fill="hsl(${h(10)} 60% 92%)" opacity=".5"/></svg>`)}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function seed(){const posts=[];for(let i=0;i<14;i++){const u=NAMES[i%NAMES.length];posts.push({id:i+1,user:u,img:art(i+3),cap:CAPS[i%CAPS.length],likes:20+Math.floor(rnd(i,1)*900),liked:false,saved:false,reel:i%3==0,t:i+1,cm:[{u:NAMES[(i+2)%8],t:'Love this!'}]})}
return{me:{name:'you',bio:'Add your bio ✏️',following:[]},posts,seen:{},nextId:100}}
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S||!S.posts)S=seed();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Storage full – post not saved offline')}};
let tab='home',q='',viewUser=null,draft=null;
const av=(u,c='')=>u===S.me.name&&S.me.photo?`<div class="av ${c}" style="background:url('${S.me.photo}') center/cover"></div>`:`<div class="av ${c}" style="background:hsl(${hue(u)} 55% 48%)">${esc(u[0].toUpperCase())}</div>`;
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;app.append(t);setTimeout(()=>t.remove(),1800)}
const ago=t=>t<24?t+'h':Math.ceil(t/24)+'d';
function postHTML(p){return `<article class="post" data-id="${p.id}"><div class="ph">${av(p.user,'s')}<span>${esc(p.user)}</span><span class="mut">· ${ago(p.t)}</span></div>
<div style="position:relative" data-act="dbl"><img class="img" src="${p.img}" alt="Post by ${esc(p.user)}"></div>
<div class="bar"><button data-act="like" class="${p.liked?'liked':''}" aria-label="Like">${p.liked?'♥':'♡'}</button><button data-act="cm" aria-label="Comments">💬</button><button data-act="share" aria-label="Share">➤</button><button class="r" data-act="save" aria-label="Save">${p.saved?'🔖':'🏷️'}</button></div>
<div class="pt"><b>${p.likes.toLocaleString()} likes</b><div><b>${esc(p.user)}</b> ${esc(p.cap)}</div>${p.cm.length?`<button class="mut" data-act="cm">View all ${p.cm.length} comments</button>`:''}</div></article>`}
function home(){const users=[...new Set(S.posts.map(p=>p.user))].slice(0,8);
return `<div class="stories"><div class="st" data-act="addpost">${av(S.me.name)}<span>Your story</span></div>${users.map(u=>`<div class="st" data-act="story" data-u="${u}"><div class="ring ${S.seen[u]?'seen':''}">${av(u)}</div><span>${u}</span></div>`).join('')}</div>${S.posts.map(postHTML).join('')}`}
function explore(){const l=S.posts.filter(p=>!q||(p.user+p.cap).toLowerCase().includes(q.toLowerCase()));
return `<input class="search" id="q" placeholder="Search people or captions" value="${esc(q)}"><div class="grid">${l.map(p=>`<img src="${p.img}" data-act="open" data-id="${p.id}" alt="">`).join('')||'<p class="pad mut">No results. Try another word.</p>'}</div>`}
function reels(){const l=S.posts.filter(p=>p.reel);return `<div class="reels">${l.map(p=>`<section class="reel" data-id="${p.id}" data-act="dbl"><img src="${p.img}" alt=""><div class="shade"></div><div class="cap"><b>@${esc(p.user)}</b><div>${esc(p.cap)}</div></div><div class="side"><div><button data-act="like" class="${p.liked?'liked':''}">${p.liked?'♥':'♡'}</button><small>${p.likes}</small></div><div><button data-act="cm">💬</button><small>${p.cm.length}</small></div><button data-act="share">➤</button></div></section>`).join('')}</div>`}
function add(){return `<div class="pad"><h2 style="margin-bottom:10px">New post</h2><label class="drop">${draft?`<img src="${draft}" alt="Preview">`:'Tap to choose a photo'}<input type="file" accept="image/*" id="file" hidden></label><div class="row" style="margin-top:12px"><input id="cap" placeholder="Write a caption"><button class="pri" data-act="publish">Share</button></div></div>`}
function profile(){const u=viewUser||S.me.name,mine=u===S.me.name,l=S.posts.filter(p=>p.user===u),f=S.me.following.includes(u);
return `<div class="pad"><div class="row" style="align-items:center">${av(u,'l')}<div class="stats"><div><b>${l.length}</b>posts</div><div><b>${mine?S.me.following.length+1200:3400+hue(u)}</b>followers</div><div><b>${mine?S.me.following.length:180}</b>following</div></div></div>
<p style="margin:10px 0 2px"><b>${esc(u)}</b></p><p class="mut" style="margin-bottom:12px">${mine?esc(S.me.bio):'Sharing little moments.'}</p>
${mine?'<button class="ghost" data-act="bio">Edit profile</button>':`<button class="${f?'ghost':'pri'}" data-act="follow">${f?'Following':'Follow'}</button>`}</div>
<div class="grid">${l.map(p=>`<img src="${p.img}" data-act="open" data-id="${p.id}" alt="">`).join('')||'<p class="pad mut">No posts yet. Tap + to share your first photo.</p>'}</div>`}
function render(keep){const m=$('main'),sc=keep&&m?m.scrollTop:0;
const body={home,explore,reels,add,profile}[tab]();
app.innerHTML=`<header><h1>Frame</h1><span class="mut">${{home:'Home',explore:'Explore',reels:'Reels',add:'Create',profile:'Profile'}[tab]}</span></header><main ${tab==='reels'?'style="overflow:hidden"':''}>${body}</main><nav>${[['home','⌂'],['explore','🔍'],['add','⊕'],['reels','▶'],['profile','☺']].map(([t,i])=>`<button class="${tab===t?'on':''}" data-tab="${t}" aria-label="${t}">${i}</button>`).join('')}</nav>`;
if(keep)$('main').scrollTop=sc}
function like(p,force){if(force&&p.liked)return;p.liked=!p.liked;p.likes+=p.liked?1:-1;save()}
function sheet(p){const d=document.createElement('div');d.className='sheet';
const paint=()=>d.innerHTML=`<div class="box"><b>Comments</b><div class="list">${p.cm.map(c=>`<div class="cm"><b>${esc(c.u)}</b> ${esc(c.t)}</div>`).join('')||'<p class="mut">No comments yet. Start the conversation.</p>'}</div><div class="row"><input id="ci" placeholder="Add a comment"><button class="pri" id="cs">Post</button></div></div>`;
paint();app.append(d);
d.onclick=e=>{if(e.target===d){d.remove();render(true)}if(e.target.id==='cs')send()};
const send=()=>{const i=d.querySelector('#ci'),t=i.value.trim();if(!t)return;p.cm.push({u:S.me.name,t});save();paint();d.querySelector('#ci').focus()};
d.onkeydown=e=>{if(e.key==='Enter')send()}}
function story(u){const items=S.posts.filter(p=>p.user===u).slice(0,4);if(!items.length)return;let i=0,tm;const o=document.createElement('div');o.className='ov';
const show=()=>{clearTimeout(tm);if(i>=items.length){o.remove();render(true);return}
o.innerHTML=`<div class="prog">${items.map((_,k)=>`<i class="${k<i?'d':k===i?'a':''}"><b></b></i>`).join('')}</div><div class="ph">${av(u,'s')}<span>${u}</span><button style="margin-left:auto;font-size:22px" id="x">✕</button></div><img src="${items[i].img}" style="flex:1;object-fit:cover;width:100%;min-height:0" alt="">`;
o.querySelector('#x').onclick=e=>{e.stopPropagation();clearTimeout(tm);o.remove();render(true)};tm=setTimeout(()=>{i++;show()},4000)};
o.onclick=()=>{i++;show()};app.append(o);S.seen[u]=1;save();show()}
function find(el){const n=el.closest('[data-id]');return n&&S.posts.find(p=>p.id==n.dataset.id)}
let lastTap=0;
app.addEventListener('click',e=>{const t=e.target.closest('[data-tab],[data-act]');if(!t)return;
if(t.dataset.tab){tab=t.dataset.tab;viewUser=null;render();return}
const a=t.dataset.act,p=find(t);
if(a==='dbl'){if(e.target.closest('button'))return;const n=Date.now();if(n-lastTap<350&&p){like(p,true);const h=document.createElement('div');h.className='pop';h.textContent='❤️';t.append(h);setTimeout(()=>{h.remove();render(true)},700)}lastTap=n;return}
if(a==='like'&&p){like(p);render(true)}
else if(a==='save'&&p){p.saved=!p.saved;save();render(true);toast(p.saved?'Saved':'Removed from saved')}
else if(a==='cm'&&p)sheet(p);
else if(a==='share'&&p){const u=location.href;if(navigator.share)navigator.share({title:'Frame',text:p.cap,url:u}).catch(()=>{});else{navigator.clipboard&&navigator.clipboard.writeText(u);toast('Link copied')}}
else if(a==='story')story(t.dataset.u);
else if(a==='addpost'){tab='add';render()}
else if(a==='open'){const q2=S.posts.find(x=>x.id==t.dataset.id);tab='home';S.posts=[q2,...S.posts.filter(x=>x!==q2)];render()}
else if(a==='publish'){if(!draft){toast('Choose a photo first');return}S.posts.unshift({id:S.nextId++,user:S.me.name,img:draft,cap:$('#cap').value||'',likes:0,liked:false,saved:false,reel:false,t:1,cm:[]});draft=null;save();tab='home';render();toast('Posted')}
else if(a==='bio'){const b=prompt('Your bio',S.me.bio);if(b!==null){S.me.bio=b.slice(0,120);save();render(true)}}
else if(a==='follow'){const k=S.me.following,i=k.indexOf(viewUser);i<0?k.push(viewUser):k.splice(i,1);save();render(true)}});
app.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;const pos=e.target.selectionStart;render(true);const n=$('#q');n.focus();n.setSelectionRange(pos,pos)}});
app.addEventListener('change',e=>{if(e.target.id==='file'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,720/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);const cap=$('#cap').value;draft=c.toDataURL('image/jpeg',.8);render();$('#cap').value=cap};im.src=r.result};r.readAsDataURL(f)}});
app.addEventListener('click',e=>{const h=e.target.closest('.ph span:not(.mut)');if(h&&!e.target.closest('.ov')){const p=find(h);if(p){viewUser=p.user;tab='profile';render()}}});
</script><style>
:root[data-theme=dark]{--bg:#0f0f13;--fg:#f2f2f6;--mut:#8e8e99;--line:#26262e;--card:#1b1b22}

svg.i{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.tabs{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.tabs button{flex:1;padding:10px;color:var(--mut)}.tabs button.on{color:var(--fg);border-bottom:2px solid var(--acc)}
</style><script>
document.title='AYDIX';
const P={home:'M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z',explore:'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-5-5',add:'M12 5v14M5 12h14',reels:'M4 4h16v16H4zM4 9h16M9 4l3 5M14 4l3 5M10 12.5l4 2.5-4 2.5z',profile:'M12 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM4 21c0-4 4-6 8-6s8 2 8 6',bell:'M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7zM10 20a2 2 0 0 0 4 0',dm:'M21 4L3 11l7 3 3 7zM10 14l11-10',menu:'M4 6h16M4 12h16M4 18h16'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="${P[n]}"/></svg>`;
const logo='<svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6c4cff"/><stop offset="1" stop-color="#ff4d8d"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#lg)"/><path d="M8 24L16 7l8 17M11.5 18h9" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
S.notifs=S.notifs||[{id:1,u:'maya',tx:'started following you',un:1,ago:'2h'},{id:2,u:'rohan',tx:'liked your post',un:1,ago:'5h'},{id:3,u:'zoya',tx:'commented: Nice shot!',un:1,ago:'1d'},{id:4,u:'kabir',tx:'mentioned you in a comment',un:0,ago:'2d'}];
S.dms=S.dms||NAMES.slice(0,4).map((u,i)=>({u,un:i<2?1:0,req:i==3,m:[{me:0,tx:['Hey! Loved your last post','Are we meeting Sunday?','Sent you the details','Can we connect?'][i],ts:Date.now()-i*18e6}]}));
S.hist=S.hist||[];S.blocked=S.blocked||[];S.reports=S.reports||[];S.set=S.set||{theme:'auto',private:false,notif:true};
S.posts.forEach(p=>{if(!p.cap.includes('#'))p.cap+=' #'+['travel','mood','city','coffee'][p.id%4];p.cm=p.cm.map((c,i)=>Object.assign({id:p.id*100+i,likes:0,liked:false},c))});
function theme(){document.documentElement.dataset.theme=S.set.theme==='auto'?'':S.set.theme}theme();
let ptab='posts',cur=null,pubBusy=false,D=S.draft||{cap:'',tags:'',loc:'',tp:''};window.dq='';if(S.draft&&S.draft.img)draft=S.draft.img;
const unN=()=>S.notifs.filter(n=>n.un).length,unD=()=>S.dms.filter(d=>d.un).length,bd=n=>n?`<i class="bd">${n}</i>`:'';
const vis=f=>{const a=S.posts;S.posts=a.filter(p=>!S.blocked.includes(p.user));try{return f()}finally{S.posts=a}};
